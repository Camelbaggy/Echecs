name: Classement FIDE mensuel

on:
  schedule:
    - cron: "17 8 1,2 * *"
  workflow_dispatch:

concurrency:
  group: classement-fide
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Télécharger et parser les listes FIDE
        run: python3 run_pipeline.py --fide

      - name: Publier le classement FIDE
        run: |
          bash .github/scripts/publier.sh "chore: mise à jour du classement mensuel FIDE" fide
