name: Fiches joueurs (Wikidata & Wikipédia)

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: fiches-joueurs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  joueurs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mettre à jour les fiches joueurs
        run: python3 run_pipeline.py --joueurs

      - name: Publier les fiches joueurs
        run: |
          bash .github/scripts/publier.sh "chore: mise à jour des fiches joueurs" joueurs
