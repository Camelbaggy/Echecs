name: Collecte tournois OTB

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      max_tournois:
        description: "Nombre maximal de tournois à examiner"
        default: "25"
      sf_budget:
        description: "Budget Stockfish (parties par passage)"
        default: "15"

concurrency:
  group: collecte-tournois
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Stockfish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish

      - name: Collecter les tournois OTB majeurs
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 run_pipeline.py --tournois --max ${{ inputs.max_tournois || '25' }} --sf-budget ${{ inputs.sf_budget || '15' }}

      - name: Publier les données
        run: |
          bash .github/scripts/publier.sh "chore: mise à jour des tournois OTB" tournois joueurs historique
