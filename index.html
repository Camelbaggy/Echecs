    function fmtClk(sec) {
      if (sec == null) return '—';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function fmtEval(c) {
      if (!c) return '';
      if (c.m != null) return c.m > 0 ? `#${c.m}` : `#-${Math.abs(c.m)}`;
      if (c.e != null) return `${c.e > 0 ? '+' : ''}${(c.e / 100).toFixed(1).replace('.', ',')}`;
      return '';
    }

    function winPctFromPly(c) {
      if (!c) return 50;
      if (c.m != null) return c.m > 0 ? 100 : 0;
      if (c.e != null) {
        const cp = Math.max(-1000, Math.min(1000, c.e));
        return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
      }
      return 50;
    }

    function infoBtn(html, label = 'Information') {
      const idx = STATE.infoTexts.push(html) - 1;
      return `<button type="button" class="info-btn" data-info="${idx}" aria-label="${esc(label)}">ⓘ</button>`;
    }

    /* ===== MINI-MOTEUR D'ÉCHIQUIER (UCI -> POSITIONS 64 CASES) ===== */
    function initBoardArray() {
      const b = new Array(64).fill('');
      const back = 'RNBQKBNR';
      for (let f = 0; f < 8; f++) {
        b[f] = back[f];
        b[8 + f] = 'P';
        b[48 + f] = 'p';
        b[56 + f] = back[f].toLowerCase();
      }
      return b;
    }

    function sqIdx(sq) { return (sq.charCodeAt(0) - 97) + (parseInt(sq[1], 10) - 1) * 8; }

    function buildBoardsFromCoups(coups) {
      const boards = [{ b: initBoardArray(), from: -1, to: -1 }];
      for (const c of coups || []) {
        const prev = boards[boards.length - 1].b.slice();
        if (!c.u || c.u.length < 4) {
          boards.push({ b: prev, from: -1, to: -1 });
          continue;
        }
        const src = sqIdx(c.u.slice(0, 2));
        const dst = sqIdx(c.u.slice(2, 4));
        const promo = c.u[4] || '';
        const piece = prev[src];
        const isW = piece === piece.toUpperCase();
        // Prise en passant
        if (piece.toUpperCase() === 'P' && (src % 8) !== (dst % 8) && !prev[dst]) {
          prev[(dst % 8) + Math.floor(src / 8) * 8] = '';
        }
        prev[dst] = promo ? (isW ? promo.toUpperCase() : promo.toLowerCase()) : piece;
        prev[src] = '';
        // Roque
        if (piece.toUpperCase() === 'K' && Math.abs((dst % 8) - (src % 8)) === 2) {
          const rank = Math.floor(src / 8);
          if (dst % 8 === 6) { prev[rank * 8 + 5] = prev[rank * 8 + 7]; prev[rank * 8 + 7] = ''; }
          else if (dst % 8 === 2) { prev[rank * 8 + 3] = prev[rank * 8 + 0]; prev[rank * 8 + 0] = ''; }
        }
        boards.push({ b: prev, from: src, to: dst });
      }
      return boards;
    }

    /* ===== CHARGEMENT DES DONNÉES ===== */
    async function loadJson(rel) {
      const r = await fetch(DATA_URL(rel));
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    /* ===== PARSEUR PGN + MOTEUR SAN -> UCI POUR LE DIRECT LICHESS (JS PUR) ===== */
    class LiveBoard {
      constructor() {
        this.sq = initBoardArray();
        this.turn = 'w';
        this.ep = -1;
      }
      clone() {
        const c = new LiveBoard();
        c.sq = this.sq.slice();
        c.turn = this.turn;
        c.ep = this.ep;
        return c;
      }
      kingSq(color) {
        const k = color === 'w' ? 'K' : 'k';
        return this.sq.indexOf(k);
      }
      isAttacked(s, by) {
        const f = s % 8, r = (s / 8) | 0;
        const pr = by === 'w' ? r - 1 : r + 1;
        const pw = by === 'w' ? 'P' : 'p';
        if (pr >= 0 && pr < 8) {
          if (f > 0 && this.sq[pr * 8 + f - 1] === pw) return true;
          if (f < 7 && this.sq[pr * 8 + f + 1] === pw) return true;
        }
        const kn = by === 'w' ? 'N' : 'n';
        for (const [df, dr] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
          const nf = f + df, nr = r + dr;
          if (nf >= 0 && nf < 8 && nr >= 0 && nr < 8 && this.sq[nr * 8 + nf] === kn) return true;
        }
        const ki = by === 'w' ? 'K' : 'k';
        for (let df = -1; df <= 1; df++) for (let dr = -1; dr <= 1; dr++) {
          if (!df && !dr) continue;
          const nf = f + df, nr = r + dr;
          if (nf >= 0 && nf < 8 && nr >= 0 && nr < 8 && this.sq[nr * 8 + nf] === ki) return true;
        }
        const rq = by === 'w' ? 'RQ' : 'rq';
        for (const [df, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          let cf = f + df, cr = r + dr;
          while (cf >= 0 && cf < 8 && cr >= 0 && cr < 8) {
            const p = this.sq[cr * 8 + cf];
            if (p) { if (rq.includes(p)) return true; break; }
            cf += df; cr += dr;
          }
        }
        const bq = by === 'w' ? 'BQ' : 'bq';
        for (const [df, dr] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
          let cf = f + df, cr = r + dr;
          while (cf >= 0 && cf < 8 && cr >= 0 && cr < 8) {
            const p = this.sq[cr * 8 + cf];
            if (p) { if (bq.includes(p)) return true; break; }
            cf += df; cr += dr;
          }
        }
        return false;
      }
      pathClear(sf, sr, df, dr) {
        const stf = df === sf ? 0 : (df > sf ? 1 : -1);
        const str = dr === sr ? 0 : (dr > sr ? 1 : -1);
        let cf = sf + stf, cr = sr + str;
        while (cf !== df || cr !== dr) {
          if (this.sq[cr * 8 + cf]) return false;
          cf += stf; cr += str;
        }
        return true;
      }
      canReach(src, dst, pt, isCap) {
        const sf = src % 8, sr = (src / 8) | 0, df = dst % 8, dr = (dst / 8) | 0;
        const dx = df - sf, dy = dr - sr;
        if (pt === 'P') {
          const step = this.turn === 'w' ? 1 : -1;
          const startR = this.turn === 'w' ? 1 : 6;
          if (isCap) return Math.abs(dx) === 1 && dy === step && (Boolean(this.sq[dst]) || dst === this.ep);
          if (dx !== 0 || this.sq[dst]) return false;
          if (dy === step) return true;
          return dy === 2 * step && sr === startR && !this.sq[(sr + step) * 8 + sf];
        }
        if (pt === 'N') return (Math.abs(dx) === 1 && Math.abs(dy) === 2) || (Math.abs(dx) === 2 && Math.abs(dy) === 1);
        if (pt === 'K') return Math.max(Math.abs(dx), Math.abs(dy)) === 1;
        if (pt === 'B') return Math.abs(dx) === Math.abs(dy) && dx !== 0 && this.pathClear(sf, sr, df, dr);
        if (pt === 'R') return (dx === 0 || dy === 0) && (dx !== 0 || dy !== 0) && this.pathClear(sf, sr, df, dr);
        if (pt === 'Q') return (dx === 0 || dy === 0 || Math.abs(dx) === Math.abs(dy)) && (dx !== 0 || dy !== 0) && this.pathClear(sf, sr, df, dr);
        return false;
      }
      applyRaw(src, dst, promo) {
        const p = this.sq[src], pt = p.toUpperCase();
        if (pt === 'P' && dst === this.ep && !this.sq[dst]) {
          this.sq[(dst % 8) + ((src / 8) | 0) * 8] = '';
        }
        this.sq[dst] = promo ? (this.turn === 'w' ? promo.toUpperCase() : promo.toLowerCase()) : p;
        this.sq[src] = '';
        if (pt === 'K' && Math.abs((dst % 8) - (src % 8)) === 2) {
          const rank = (src / 8) | 0;
          if (dst % 8 === 6) { this.sq[rank * 8 + 5] = this.sq[rank * 8 + 7]; this.sq[rank * 8 + 7] = ''; }
          else if (dst % 8 === 2) { this.sq[rank * 8 + 3] = this.sq[rank * 8 + 0]; this.sq[rank * 8 + 0] = ''; }
        }
        this.ep = (pt === 'P' && Math.abs(((dst / 8) | 0) - ((src / 8) | 0)) === 2) ? ((src + dst) >> 1) : -1;
        this.turn = this.turn === 'w' ? 'b' : 'w';
      }
      pushSan(san) {
        const m = /^(?:(O-O-O|O-O|0-0-0|0-0)|([KQRBN])?([a-h])?([1-8])?(x)?([a-h][1-8])(?:=([QRBN]))?)[+#?!]*$/.exec(san.trim());
        if (!m) return '';
        const [, castle, ptRaw, sf, sr, cap, dstS, promo] = m;
        const idxToSq = (i) => 'abcdefgh'[i % 8] + (((i / 8) | 0) + 1);
        if (castle) {
          const rank = this.turn === 'w' ? 0 : 7;
          const src = rank * 8 + 4, dst = rank * 8 + (castle.length === 5 ? 2 : 6);
          this.applyRaw(src, dst, '');
          return idxToSq(src) + idxToSq(dst);
        }
        const pt = ptRaw || 'P', dst = sqIdx(dstS);
        const pc = this.turn === 'w' ? pt : pt.toLowerCase();
        const isCap = Boolean(cap) || Boolean(this.sq[dst]) || (pt === 'P' && dst === this.ep);
        const opp = this.turn === 'w' ? 'b' : 'w';
        let found = -1;
        for (let i = 0; i < 64; i++) {
          if (this.sq[i] !== pc) continue;
          if (sf && 'abcdefgh'[i % 8] !== sf) continue;
          if (sr && String(((i / 8) | 0) + 1) !== sr) continue;
          if (!this.canReach(i, dst, pt, isCap)) continue;
          const t = this.clone();
          t.applyRaw(i, dst, promo || '');
          const ks = t.kingSq(this.turn);
          if (ks >= 0 && t.isAttacked(ks, opp)) continue;
          found = i; break;
        }
        if (found < 0) return '';
        this.applyRaw(found, dst, promo || '');
        return idxToSq(found) + idxToSq(dst) + (promo ? promo.toLowerCase() : '');
      }
    }

    function parsePgnLive(pgnText, tourId, roundId, roundName, playersRef = []) {
      const byFide = new Map(), byName = new Map();
      for (const j of playersRef) {
        if (j.fide_id) byFide.set(String(j.fide_id), j);
        byName.set((j.nom || '').toLowerCase(), j);
      }
      const blocks = pgnText.trim().split(/\n\s*\n(?=\[Event\s)/).filter((b) => b.trim());
      const parties = [];
      for (let idx = 0; idx < Math.min(blocks.length, 30); idx++) {
        const blk = blocks[idx];
        const headers = {};
        const moveLines = [];
        for (const line of blk.split(/\r?\n/)) {
          const hm = /^\[([A-Za-z0-9_]+)\s+"((?:\\.|[^"\\])*)"\]\s*$/.exec(line.trim());
          if (hm) headers[hm[1]] = hm[2].replace(/\\"/g, '"');
          else if (line.trim()) moveLines.push(line.trim());
        }
        const mt = moveLines.join(' ');
        const tokens = [];
        let i = 0, depth = 0;
        while (i < mt.length) {
          const ch = mt[i];
          if (/\s/.test(ch)) { i++; continue; }
          if (ch === '(') { depth++; i++; continue; }
          if (ch === ')') { depth = Math.max(0, depth - 1); i++; continue; }
          if (ch === '{') {
            const end = mt.indexOf('}', i + 1);
            if (end < 0) break;
            if (depth === 0 && tokens.length) tokens[tokens.length - 1].c += ' ' + mt.slice(i + 1, end);
            i = end + 1; continue;
          }
          if (ch === '}') { i++; continue; }
          let j = i;
          while (j < mt.length && !/\s/.test(mt[j]) && !'(){}'.includes(mt[j])) j++;
          if (j === i) { i++; continue; }
          const w = mt.slice(i, j).replace(/^\d+\.+/, '');
          i = j;
          if (depth > 0 || !w || w.startsWith('$') || ['1-0','0-1','1/2-1/2','*'].includes(w)) continue;
          tokens.push({ s: w, c: '' });
        }
        const board = new LiveBoard();
        const coups = [];
        let uciOk = true;
        for (const tk of tokens) {
          const u = uciOk ? board.pushSan(tk.s) : '';
          if (!u) uciOk = false;
          const item = { s: tk.s };
          if (u) item.u = u;
          const me = /\[%eval\s+([#+-]?\d+(?:\.\d+)?)\]/.exec(tk.c);
          if (me) {
            if (me[1].startsWith('#')) item.m = parseInt(me[1].slice(1), 10);
            else item.e = Math.round(parseFloat(me[1]) * 100);
          }
          const mc = /\[%clk\s+(\d+):(\d+):(\d+(?:\.\d+)?)\]/.exec(tk.c);
          if (mc) item.c = Math.round(Number(mc[1]) * 3600 + Number(mc[2]) * 60 + Number(mc[3]));
          coups.push(item);
        }
        const mkP = (nom, fid, elo, tit) => {
          const ref = (fid && byFide.get(String(fid))) || byName.get((nom || '').toLowerCase());
          const fed = ref?.fed || '';
          return {
            nom: ref?.nom || nom || '?',
            fide_id: fid || ref?.fide_id || '',
            fed,
            drapeau: ref?.drapeau || '',
            francais: fed === 'FRA',
            titre: tit || ref?.titre || '',
            elo: /^\d+$/.test(elo || '') ? Number(elo) : (ref?.elo || null),
          };
        };
        const blancs = mkP(headers.White, headers.WhiteFideId, headers.WhiteElo, headers.WhiteTitle);
        const noirs = mkP(headers.Black, headers.BlackFideId, headers.BlackElo, headers.BlackTitle);
        const res = (headers.Result || '*').trim();
        const evals = coups.filter((c) => c.e != null || c.m != null).length;
        const courbe = evals >= 2 ? coups.map((c) => (c.e != null || c.m != null) ? Number(winPctFromPly(c).toFixed(1)) : null) : null;
        parties.push({
          id: `${tourId}-${roundId}-${idx + 1}`,
          echiquier: idx + 1,
          ronde_id: roundId,
          ronde: roundName,
          date: (headers.UTCDate || headers.Date || '').replace(/\./g, '-'),
          blancs, noirs,
          resultat: res,
          statut: ['1-0','0-1','1/2-1/2'].includes(res) ? 'terminee' : 'en_cours',
          est_francais: Boolean(blancs.francais || noirs.francais),
          nb_coups: Math.ceil(coups.length / 2),
          eco: headers.ECO || '',
          ouverture: headers.Opening || '',
          coups,
          direct: true,
          eval_source: courbe ? 'lichess' : '',
          analyse: courbe ? { courbe, blancs: {}, noirs: {}, tournants: [] } : null,
        });
      }
      return parties;
    }

    async function loadTournoi(id) {
      if (STATE.tournoiCache.has(id)) return STATE.tournoiCache.get(id);
      const dansComplet = (STATE.indexTournois?.tournois || []).some((x) => x.id === id);
      const dansHist = (STATE.indexHistorique?.tournois || []).some((x) => x.id === id);
      let t;
      if (dansComplet || !dansHist) {
        try {
          t = await loadJson(`tournois/${id}.json`);
        } catch (e) {
          if (!dansHist) throw e;
          t = await loadJson(`historique/t/${id}.json`);
          t.archive = true;
        }
      } else {
        t = await loadJson(`historique/t/${id}.json`);
        t.archive = true;
      }
      STATE.tournoiCache.set(id, t);
      return t;
    }

    async function loadJoueur(fid) {
      if (STATE.joueurCache.has(fid)) return STATE.joueurCache.get(fid);
      const j = await loadJson(`joueurs/${fid}.json`);
      STATE.joueurCache.set(fid, j);
      return j;
    }

    async function chargerRondeDirect(tour, roundId) {
      const r = await fetch(`https://lichess.org/api/broadcast/round/${roundId}.pgn`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const pgnText = await r.text();
      const ronde = (tour.rondes || []).find((x) => x.id === roundId);
      const parties = parsePgnLive(pgnText, tour.id, roundId, ronde?.nom || 'En direct', tour.classement || []);
      if (ronde) {
        ronde.parties = parties;
        ronde._direct = true;
      }
      return parties;
    }

    async function ouvrirTournoiDirect(tourId, roundId, push = true) {
      $('view-tournoi').innerHTML = `<div class="empty-msg">Chargement du direct Lichess…</div>`;
      showVue('tournoi');
      try {
        // 1. Charger le tournoi déjà collecté s'il figure dans l'index (évite un 404 console)
        let base = null;
        if ((STATE.indexTournois?.tournois || []).some((x) => x.id === tourId)) {
          try { base = await loadTournoi(tourId); } catch (_) { base = null; }
        }

        // 2. Interroger l'API publique Lichess (CORS *)
        const resp = await fetch(`https://lichess.org/api/broadcast/${tourId}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const td = await resp.json();
        const tourMeta = td.tour || {};
        const info = tourMeta.info || {};
        const existingMap = new Map((base?.rondes || []).map((r) => [r.id, r]));
        const rondes = (td.rounds || []).map((r) => {
          const prev = existingMap.get(r.id);
          return {
            id: r.id,
            nom: r.name || prev?.nom || 'Ronde',
            statut: r.ongoing ? 'en_cours' : (r.finished ? 'terminee' : 'a_venir'),
            parties: prev?.parties || [],
          };
        });
        const tournoi = {
          id: tourId,
          nom: tourMeta.name || base?.nom || tourId,
          lieu: info.location || base?.lieu || '',
          cadence: info.tc || base?.cadence || '',
          debut: base?.debut || '',
          fin: base?.fin || '',
          classement: base?.classement || [],
          rondes,
          direct: true,
        };
        const cibleId = roundId || rondes.find((r) => r.statut === 'en_cours')?.id || rondes[rondes.length - 1]?.id;
        if (cibleId) await chargerRondeDirect(tournoi, cibleId);

        STATE.tournoiCache.set(tourId, tournoi);
        STATE.tournoiActif = tournoi;
        STATE.rondeActiveId = cibleId;
        syncHeader();
        renderTournoi();
        if (push) syncUrl();
      } catch (e) {
        $('view-tournoi').innerHTML = `<div class="empty-msg">Impossible de charger le direct Lichess (${esc(e.message)}).</div>`;
      }
    }

    async function refreshDirectActif() {
      if (document.hidden) return;
      const t = STATE.tournoiActif;
      if (!t || !t.direct || !STATE.rondeActiveId) return;
      const ronde = (t.rondes || []).find((r) => r.id === STATE.rondeActiveId);
      if (!ronde || ronde.statut !== 'en_cours') return;
      try {
        const parties = await chargerRondeDirect(t, STATE.rondeActiveId);
        if (STATE.vue === 'tournoi') renderTournoi();
        if ($('game-sheet').classList.contains('open') && STATE.gameCtx?.partie?.direct) {
          const fresh = parties.find((p) => p.id === STATE.gameCtx.partie.id);
          if (fresh) {
            const wasAtEnd = STATE.gameCtx.plyIdx >= STATE.gameCtx.boards.length - 1;
            const newBoards = buildBoardsFromCoups(fresh.coups || []);
            STATE.gameCtx.partie = fresh;
            STATE.gameCtx.boards = newBoards;
            if (wasAtEnd) STATE.gameCtx.plyIdx = newBoards.length - 1;
            else STATE.gameCtx.plyIdx = Math.min(STATE.gameCtx.plyIdx, newBoards.length - 1);
            $('game-sheet-title').textContent = `${nomAffiche(fresh.blancs.nom)} – ${nomAffiche(fresh.noirs.nom)} (${fresh.resultat})`;
            renderGameSheet();
          }
        }
      } catch (_) {}
    }

    function estLiveMajeur(item) {
      const nom = (item?.tour?.name || '').toLowerCase();
      const loc = (item?.tour?.info?.location || '').toLowerCase();
      if (loc === 'online' || loc === 'internet') return false;
      if (/ladder legends|titled |lichess|online|cadet|junior|youth|u12|o12|bundesliga|ekipno|division de honor|chinese chess league/.test(nom)) return false;
      return (item?.tour?.tier || 0) >= 4;
    }

    async function checkLiveLichess() {
      if (document.hidden) return;
      try {
        const r = await fetch('https://lichess.org/api/broadcast/top?page=1');
        if (!r.ok) return;
        const d = await r.json();
        const active = (d.active || []).filter(estLiveMajeur);
        STATE.liveTournois = active;
        const pill = $('live-pill');
        if (active.length) {
          pill.textContent = `Direct · ${active.length}`;
          pill.hidden = false;
        } else {
          pill.hidden = true;
        }
        if (STATE.vue === 'accueil') renderAccueil();
      } catch (_) {
        // Hors ligne ou CORS bloqué : silencieux
      }
    }

    /* ===== NAVIGATION & ROUTAGE ===== */
    function syncHeader() {
      const hdr = $('app-header');
      hdr.classList.toggle('accueil', STATE.vue === 'accueil');
      if (STATE.vue === 'accueil') $('header-title').textContent = '♔ Échecs';
      else if (STATE.vue === 'fide') $('header-title').textContent = 'Classement FIDE';
      else if (STATE.tournoiActif) $('header-title').textContent = STATE.tournoiActif.nom;
    }

    function syncUrl(replace = false) {
      const u = new URL(location.href);
      u.searchParams.delete('t'); u.searchParams.delete('r'); u.searchParams.delete('v');
      if (STATE.vue === 'fide') u.searchParams.set('v', 'fide');
      else if (STATE.vue === 'tournoi' && STATE.tournoiActif) {
        u.searchParams.set('t', STATE.tournoiActif.id);
        if (STATE.rondeActiveId) u.searchParams.set('r', STATE.rondeActiveId);
      }
      if (replace) history.replaceState(null, '', u);
      else history.pushState(null, '', u);
    }

    function showVue(vue) {
      STATE.vue = vue;
      $('view-accueil').hidden = vue !== 'accueil';
      $('view-tournoi').hidden = vue !== 'tournoi';
      $('view-fide').hidden = vue !== 'fide';
      syncHeader();
      renderMenu();
    }

    async function ouvrirAccueil(push = true) {
      showVue('accueil');
      renderAccueil();
      if (push) syncUrl();
    }

    async function ouvrirFide(push = true) {
      showVue('fide');
      renderFide();
      if (push) syncUrl();
    }

    async function ouvrirTournoi(id, rondeId = null, push = true) {
      try {
        const t = await loadTournoi(id);
        STATE.tournoiActif = t;
        const rondes = t.rondes || [];
        if (rondeId && rondes.some((r) => r.id === rondeId)) {
          STATE.rondeActiveId = rondeId;
        } else {
          const enCours = rondes.find((r) => r.statut === 'en_cours');
          const finies = rondes.filter((r) => r.statut === 'terminee');
          STATE.rondeActiveId = enCours?.id || finies[finies.length - 1]?.id || rondes[0]?.id || null;
        }
        showVue('tournoi');
        renderTournoi();
        if (push) syncUrl();
      } catch (e) {
        $('view-tournoi').innerHTML = `<div class="empty-msg">Impossible de charger le tournoi (${esc(e.message)}).</div>`;
        showVue('tournoi');
      }
    }

    /* ===== RENDU ACCUEIL ===== */
    function renderAccueil() {
      const el = $('view-accueil');
      const tournois = STATE.indexTournois?.tournois || [];
      let html = '';

      // 1. En direct (Lichess, ouvert DANS le dashboard)
      if (STATE.liveTournois.length) {
        html += `<div class="sec-head"><div class="sec-title">En direct (Lichess) ${infoBtn('Tournois OTB majeurs actuellement en cours. Les parties s’ouvrent directement dans le dashboard avec rafraîchissement automatique toutes les 30 s.')}</div></div>`;
        for (const item of STATE.liveTournois.slice(0, 4)) {
          const t = item.tour || {};
          const r = item.round || {};
          html += `<div class="card clickable" style="border-left:3px solid #ef4444" data-open-live="${esc(t.id)}|${esc(r.id || '')}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <b>${esc(t.name)}</b>
              <span class="live-pill">En cours</span>
            </div>
            <div class="game-meta" style="margin-top:4px">${esc(r.name || '')}${t.info?.location ? ' · ' + esc(t.info.location) : ''}</div>
          </div>`;
        }
      }

      // 2. Focus joueurs français récents
      const fraCards = [];
      for (const t of tournois) {
        for (const p of (t.francais_recents || [])) {
          fraCards.push({ ...p, tournoi_id: t.id, tournoi_nom: t.nom });
        }
      }
      if (fraCards.length) {
        html += `<div class="sec-head"><div class="sec-title">Focus joueurs français ${infoBtn('Détection automatique par code fédération FIDE (FRA). Résumés générés à partir des faits mesurés uniquement.')}</div></div>`;
        for (const c of fraCards.slice(0, 6)) {
          const pb = c.precision?.blancs;
          const pn = c.precision?.noirs;
          html += `<div class="card clickable fra-card" data-open-game="${esc(c.tournoi_id)}|${esc(c.ronde_id)}|${esc(c.partie_id)}">
            <div class="focus-meta">
              <span>${esc(c.tournoi_nom)} · ${esc(c.ronde)}</span>
              <span>${esc(c.date || '')}</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <div style="min-width:0;flex:1">
                <div class="player-line"><span class="p-dot w"></span>${flagHtml(c.blancs.drapeau, c.blancs.fed)}${titreHtml(c.blancs.titre)}<span class="p-name ${c.resultat === '1-0' ? 'win' : ''}">${esc(nomAffiche(c.blancs.nom))}</span><span class="p-elo">${c.blancs.elo || ''}</span></div>
                <div class="player-line"><span class="p-dot b"></span>${flagHtml(c.noirs.drapeau, c.noirs.fed)}${titreHtml(c.noirs.titre)}<span class="p-name ${c.resultat === '0-1' ? 'win' : ''}">${esc(nomAffiche(c.noirs.nom))}</span><span class="p-elo">${c.noirs.elo || ''}</span></div>
              </div>
              <span class="res-pill">${esc(c.resultat)}</span>
            </div>
            ${c.resume ? `<div class="focus-summary">${esc(c.resume)}</div>` : ''}
            <div class="focus-pills">
              ${c.ouverture || c.eco ? `<span class="mini-pill">${esc(c.eco ? c.eco + ' · ' : '')}${esc(c.ouverture || '')}</span>` : ''}
              ${pb != null && pn != null ? `<span class="mini-pill">Précision <b>${pb.toFixed(1).replace('.', ',')} %</b> / <b>${pn.toFixed(1).replace('.', ',')} %</b></span>` : ''}
              <span class="mini-pill">${c.nb_coups} coups</span>
            </div>
          </div>`;
        }
      }

      // 3. Tous les tournois majeurs du circuit (tournois complets + archives historiques fusionnés)
      const byId = new Map();
      for (const t of tournois) {
        const an = t.debut && /^\d{4}/.test(t.debut) ? Number(t.debut.slice(0, 4)) : null;
        byId.set(t.id, { ...t, annee: an, a_parties: true });
      }
      for (const h of (STATE.indexHistorique?.tournois || [])) {
        if (!byId.has(h.id)) {
          byId.set(h.id, {
            id: h.id,
            nom: h.nom,
            categorie: h.categorie,
            format: h.format,
            tier: h.tier,
            annee: h.annee || (h.debut && /^\d{4}/.test(h.debut) ? Number(h.debut.slice(0, 4)) : null),
            statut: h.statut || 'termine',
            debut: h.debut || '',
            fin: h.fin || '',
            lieu: h.lieu || '',
            cadence: h.cadence || '',
            nb_joueurs: h.nb_joueurs || 0,
            nb_francais: h.nb_francais || 0,
            leader: h.vainqueur || null,
            a_parties: Boolean(h.a_parties),
            archive: !h.a_parties,
          });
        }
      }
      const tousTournois = [...byId.values()];
      const anneesDispo = [...new Set(tousTournois.map((t) => t.annee).filter(Boolean))].sort((a, b) => b - a);

      html += `<div class="sec-head"><div class="sec-title">Tournois majeurs du circuit (${tousTournois.length}) ${infoBtn('Ensemble des grands tournois OTB du circuit (FIDE, Super-tournois, Europe, France) : tournois en cours, saison complète et archives multi-années.')}</div></div>`;
      const filtres = [
        ['tous', 'Tous'],
        ['en_cours', 'En cours'],
        ['fide', 'Cycles FIDE'],
        ['super', 'Super-tournois'],
        ['europe', 'Europe'],
        ['france', 'France'],
      ];
      html += `<div class="seg-bar">${filtres.map(([k, l]) => `<button class="seg-btn ${STATE.accueilCat === k ? 'active' : ''}" data-acat="${k}">${l}</button>`).join('')}</div>`;
      if (anneesDispo.length > 1) {
        const yPills = [['toutes', 'Toutes années'], ...anneesDispo.map((y) => [String(y), String(y)])];
        html += `<div class="seg-bar" style="margin-top:-4px">${yPills.map(([k, l]) => `<button class="seg-btn ${STATE.accueilAnnee === k ? 'active' : ''}" data-ayear="${k}">${l}</button>`).join('')}</div>`;
      }

      const filtresList = tousTournois.filter((t) => {
        if (STATE.accueilCat === 'en_cours' && t.statut !== 'en_cours') return false;
        if (STATE.accueilCat !== 'tous' && STATE.accueilCat !== 'en_cours' && t.categorie !== STATE.accueilCat) return false;
        if (STATE.accueilAnnee !== 'toutes' && String(t.annee || '') !== STATE.accueilAnnee) return false;
        return true;
      });

      const renderCardTournoi = (t) => {
        const stLabel = t.statut === 'en_cours' ? 'En cours' : (t.statut === 'a_venir' ? 'À venir' : 'Terminé');
        const accent = CAT_COLORS[t.categorie] || 'var(--accent-super)';
        const catLbl = CAT_LABELS[t.categorie] || '';
        return `<div class="card clickable" style="border-left:3px solid ${accent}" data-open-tour="${esc(t.id)}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div>
              <b style="font-size:0.94rem">${esc(t.nom)}</b>
              <div class="game-meta" style="margin-top:2px">${catLbl ? esc(catLbl) + (t.lieu ? ' · ' : '') : ''}${esc(t.lieu || '')}${t.debut ? ' · ' + esc(t.debut.slice(0, 7)) : ''}</div>
            </div>
            <span class="statut-badge ${esc(t.statut)}">${stLabel}</span>
          </div>
          <div class="focus-pills" style="margin-top:8px">
            ${t.ronde_courante ? `<span class="mini-pill"><b>${esc(t.ronde_courante)}</b> (${t.rondes_finies}/${t.nb_rondes})</span>` : (t.nb_joueurs ? `<span class="mini-pill">${t.nb_joueurs} joueurs</span>` : '')}
            ${t.leader ? `<span class="mini-pill">${t.statut === 'termine' ? '🏆' : 'Leader'} ${flagHtml(t.leader.drapeau)} <b>${esc(nomAffiche(t.leader.nom))}</b>${t.leader.score != null ? ` (${t.leader.score})` : ''}</span>` : ''}
            ${t.nb_francais ? `<span class="mini-pill">${flagHtml('fr')} <b>${t.nb_francais}</b> FRA</span>` : ''}
          </div>
        </div>`;
      };

      if (!filtresList.length) {
        html += `<div class="empty-msg">Aucun tournoi dans cette sélection.</div>`;
      } else {
        const enCours = filtresList.filter((t) => t.statut === 'en_cours')
          .sort((a, b) => (b.tier || 0) - (a.tier || 0) || (b.debut || '').localeCompare(a.debut || ''));
        const aVenir = filtresList.filter((t) => t.statut === 'a_venir')
          .sort((a, b) => (a.debut || '').localeCompare(b.debut || ''));
        const termines = filtresList.filter((t) => t.statut === 'termine')
          .sort((a, b) => (b.debut || '').localeCompare(a.debut || '') || (b.tier || 0) - (a.tier || 0));

        const limit = STATE.accueilShowAll ? termines.length : 24;
        const terminesAffiches = termines.slice(0, limit);

        const groupes = [
          ['En cours', enCours],
          ['À venir', aVenir],
          ['Terminés & archives', terminesAffiches, termines.length],
        ];
        const multiGroupes = groupes.filter((g) => g[1].length > 0).length > 1;
        for (const [titreG, g, totalG] of groupes) {
          if (!g.length) continue;
          const cnt = totalG != null ? totalG : g.length;
          if (multiGroupes) html += `<div class="game-meta" style="margin:10px 2px 6px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">${titreG} (${cnt})</div>`;
          html += g.map(renderCardTournoi).join('');
        }
        if (termines.length > limit) {
          html += `<button type="button" class="ronde-btn" id="btn-show-all-tours" style="justify-content:center;font-weight:600;color:var(--accent-super)">Afficher les ${termines.length - limit} autres éditions du circuit</button>`;
        }
      }

      // 4. Aperçu Classement FIDE (Top 5 France)
      const topFra = STATE.fide?.france?.standard?.slice(0, 5) || [];
      if (topFra.length) {
        html += `<div class="sec-head">
          <div class="sec-title">Top France FIDE (${esc(STATE.fide.periode || '')})</div>
          <button class="sec-action" id="btn-voir-fide">Voir tout →</button>
        </div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>#</th><th>Joueur</th><th class="num">Elo</th></tr></thead>
          <tbody>${topFra.map((r) => `<tr class="clickable fra-row" data-open-player="${esc(r.id)}">
            <td>${r.rang}</td>
            <td><div class="name-cell">${flagHtml(r.drapeau, r.fed)}${titreHtml(r.titre)}<span>${esc(nomAffiche(r.nom))}</span></div></td>
            <td class="num"><b>${r.elo}</b></td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      }

      el.innerHTML = html;
      const btnFide = $('btn-voir-fide');
      if (btnFide) btnFide.onclick = () => ouvrirFide();
      const btnMore = $('btn-show-all-tours');
      if (btnMore) btnMore.onclick = () => { STATE.accueilShowAll = true; renderAccueil(); };
    }

    /* ===== RENDU TOURNOI ===== */
    function renderTournoi() {
      const t = STATE.tournoiActif;
      if (!t) return;
      const el = $('view-tournoi');
      const ronde = (t.rondes || []).find((r) => r.id === STATE.rondeActiveId) || (t.rondes || [])[0];

      let html = `<div class="tour-hero">
        <h1>${esc(t.nom)}</h1>
        <div class="tour-sub">
          ${t.direct ? `<span class="live-pill">En direct · maj 30 s</span>` : ''}
          ${t.archive ? `<span class="mini-pill">Archive du circuit · Classement final</span>` : ''}
          ${t.lieu ? `<span>📍 ${esc(t.lieu)}</span>` : ''}
          ${t.cadence ? `<span>⏱ ${esc(t.cadence)}</span>` : ''}
          ${t.debut ? `<span>📅 ${esc(t.debut)}${t.fin ? ' → ' + esc(t.fin) : ''}</span>` : ''}
        </div>
      </div>`;

      if (ronde) {
        const nbP = (ronde.parties || []).length;
        html += `<button class="ronde-btn" id="ronde-btn">
          <div><div class="rt">${esc(ronde.nom)}</div><div class="rs">${nbP ? nbP + ' parties' : (ronde.statut === 'a_venir' ? 'À venir' : 'Aucune partie')}</div></div>
          <span>▾</span>
        </button>`;

        // Focus Français de la ronde
        const fraRonde = (ronde.parties || []).filter((p) => p.est_francais && p.resume);
        if (fraRonde.length) {
          html += `<div class="sec-head"><div class="sec-title">Focus Français</div></div>`;
          for (const p of fraRonde) {
            html += `<div class="card clickable fra-card" data-open-game="${esc(t.id)}|${esc(ronde.id)}|${esc(p.id)}">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                <div style="min-width:0;flex:1">
                  <div class="player-line"><span class="p-dot w"></span>${flagHtml(p.blancs.drapeau)}${titreHtml(p.blancs.titre)}<span class="p-name">${esc(nomAffiche(p.blancs.nom))}</span></div>
                  <div class="player-line"><span class="p-dot b"></span>${flagHtml(p.noirs.drapeau)}${titreHtml(p.noirs.titre)}<span class="p-name">${esc(nomAffiche(p.noirs.nom))}</span></div>
                </div>
                <span class="res-pill">${esc(p.resultat)}</span>
              </div>
              <div class="focus-summary">${esc(p.resume)}</div>
            </div>`;
          }
        }

        // Liste des parties de la ronde
        html += `<div class="sec-head"><div class="sec-title">Parties · ${esc(ronde.nom)}</div></div>`;
        if (!nbP) {
          html += `<div class="empty-msg">${ronde.statut === 'a_venir' ? 'Ronde programmée à venir.' : 'Aucune partie publiée pour cette ronde.'}</div>`;
        } else {
          for (const p of ronde.parties) {
            const pb = p.analyse?.blancs?.precision;
            const pn = p.analyse?.noirs?.precision;
            html += `<div class="game-row ${p.est_francais ? 'fra' : ''}" data-open-game="${esc(t.id)}|${esc(ronde.id)}|${esc(p.id)}">
              <div style="min-width:0">
                <div class="player-line"><span class="p-dot w"></span>${flagHtml(p.blancs.drapeau)}${titreHtml(p.blancs.titre)}<span class="p-name ${p.resultat === '1-0' ? 'win' : ''}">${esc(nomAffiche(p.blancs.nom))}</span><span class="p-elo">${p.blancs.elo || ''}</span></div>
                <div class="player-line"><span class="p-dot b"></span>${flagHtml(p.noirs.drapeau)}${titreHtml(p.noirs.titre)}<span class="p-name ${p.resultat === '0-1' ? 'win' : ''}">${esc(nomAffiche(p.noirs.nom))}</span><span class="p-elo">${p.noirs.elo || ''}</span></div>
              </div>
              <div class="game-right">
                <span class="res-pill">${esc(p.resultat)}</span>
                <span class="game-meta">${p.nb_coups ? p.nb_coups + ' c.' : ''}${pb != null ? ` · ${Math.round(pb)}/${Math.round(pn)}%` : ''}</span>
              </div>
            </div>`;
          }
        }
      }

      // Classement du tournoi
      const cl = t.classement || [];
      if (cl.length) {
        html += `<div class="sec-head"><div class="sec-title">Classement (${cl.length}) ${infoBtn('Classement officiel issu de Lichess Broadcasts. Cliquez sur un joueur pour ouvrir sa fiche.')}</div></div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>#</th><th>Joueur</th><th class="num">Elo</th><th class="num">Pts</th><th class="num">Perf</th></tr></thead>
          <tbody>${cl.slice(0, 100).map((j) => `<tr class="${j.fide_id ? 'clickable' : ''} ${j.francais ? 'fra-row' : ''}" ${j.fide_id ? `data-open-player="${esc(j.fide_id)}"` : ''}>
            <td>${j.rang}</td>
            <td><div class="name-cell">${flagHtml(j.drapeau, j.fed)}${titreHtml(j.titre)}<span>${esc(nomAffiche(j.nom))}</span></div></td>
            <td class="num">${j.elo || '—'}</td>
            <td class="num"><b>${j.score ?? '—'}</b>${j.jouees ? `<span style="color:var(--text-muted);font-size:0.72rem">/${j.jouees}</span>` : ''}</td>
            <td class="num">${j.perf || '—'}</td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      }

      el.innerHTML = html;
      const rBtn = $('ronde-btn');
      if (rBtn) rBtn.onclick = openRondeMenu;
    }

    function openRondeMenu() {
      const t = STATE.tournoiActif;
      if (!t) return;
      $('ronde-list').innerHTML = (t.rondes || []).slice().reverse().map((r) => `
        <button class="menu-item" aria-current="${r.id === STATE.rondeActiveId ? 'true' : 'false'}" data-choose-ronde="${esc(r.id)}">
          <b>${esc(r.nom)}</b>
          <span>${r.statut === 'terminee' ? 'Terminée' : (r.statut === 'en_cours' ? 'En cours' : 'À venir')}${r.parties?.length ? ' · ' + r.parties.length + ' parties' : ''}</span>
        </button>
      `).join('');
      openSheet('ronde-modal');
    }

    /* ===== RENDU CLASSEMENT FIDE MENSUEL ===== */
    function renderFide() {
      const el = $('view-fide');
      const f = STATE.fide;
      if (!f) {
        el.innerHTML = `<div class="empty-msg">Classement FIDE non encore collecté.</div>`;
        return;
      }
      const cats = [
        ['monde', 'Monde'], ['france', 'France'], ['femmes', 'Femmes'], ['juniors', 'Juniors'],
      ];
      const cads = STATE.fideCat === 'juniors'
        ? [['standard', 'Classique']]
        : [['standard', 'Classique'], ['rapid', 'Rapide'], ['blitz', 'Blitz']];
      if (STATE.fideCat === 'juniors') STATE.fideCad = 'standard';

      const rows = (f[STATE.fideCat]?.[STATE.fideCad] || []).filter((r) => {
        if (!STATE.fideQuery) return true;
        const q = STATE.fideQuery.toLowerCase();
        return r.nom.toLowerCase().includes(q) || (r.fed || '').toLowerCase().includes(q);
      });

      el.innerHTML = `
        <div class="sec-head">
          <div class="sec-title">Classement FIDE · ${esc(f.periode || '')} ${infoBtn('Listes mensuelles officielles FIDE (joueurs actifs uniquement). Source : ratings.fide.com.')}</div>
        </div>
        <div class="seg-bar">${cats.map(([k, l]) => `<button class="seg-btn ${STATE.fideCat === k ? 'active' : ''}" data-fcat="${k}">${l}</button>`).join('')}</div>
        <div class="seg-bar">${cads.map(([k, l]) => `<button class="seg-btn ${STATE.fideCad === k ? 'active' : ''}" data-fcad="${k}">${l}</button>`).join('')}</div>
        <input type="search" class="search-input" id="fide-search" placeholder="Filtrer un joueur ou une fédération (ex. FRA, Carlsen)…" value="${esc(STATE.fideQuery)}">
        <div class="tbl-wrap"><table>
          <thead><tr><th>#</th><th>Joueur</th><th class="num">Elo</th><th class="num">Né</th></tr></thead>
          <tbody>${rows.length ? rows.map((r) => `<tr class="clickable ${r.francais ? 'fra-row' : ''}" data-open-player="${esc(r.id)}">
            <td>${r.rang}</td>
            <td><div class="name-cell">${flagHtml(r.drapeau, r.fed)}${titreHtml(r.titre)}<span>${esc(nomAffiche(r.nom))}</span></div></td>
            <td class="num"><b>${r.elo}</b></td>
            <td class="num" style="color:var(--text-muted)">${r.naissance || '—'}</td>
          </tr>`).join('') : `<tr><td colspan="4" class="empty-msg">Aucun joueur trouvé.</td></tr>`}</tbody>
        </table></div>
      `;

      const inp = $('fide-search');
      if (inp) inp.oninput = (ev) => { STATE.fideQuery = ev.target.value; renderFide(); const n = $('fide-search'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
    }

    /* ===== MENU LATÉRAL ===== */
    function renderMenu() {
      const tournois = STATE.indexTournois?.tournois || [];
      let html = `
        <button class="menu-item" aria-current="${STATE.vue === 'accueil' ? 'true' : 'false'}" data-nav="accueil"><b>🏠 Accueil</b><span>En direct, Focus Français, tournois récents</span></button>
        <button class="menu-item" aria-current="${STATE.vue === 'fide' ? 'true' : 'false'}" data-nav="fide" style="border-left-color:var(--accent-elo)"><b>🏆 Classement FIDE mensuel</b><span>Monde · France · Femmes · Juniors</span></button>
      `;
      for (const cat of ['fide', 'super', 'europe', 'france']) {
        const list = tournois.filter((t) => t.categorie === cat);
        if (!list.length) continue;
        html += `<div class="menu-sec">${CAT_LABELS[cat]} (${list.length})</div>`;
        for (const t of list) {
          const active = STATE.vue === 'tournoi' && STATE.tournoiActif?.id === t.id;
          const st = t.statut === 'en_cours' ? 'En cours' : (t.statut === 'a_venir' ? 'À venir' : 'Terminé');
          html += `<button class="menu-item" aria-current="${active ? 'true' : 'false'}" style="border-left-color:${CAT_COLORS[cat]}" data-open-tour="${esc(t.id)}">
            <b>${esc(t.nom)}</b>
            <span>${st}${t.debut ? ' · ' + esc(t.debut.slice(0, 7)) : ''}${t.lieu ? ' · ' + esc(t.lieu) : ''}</span>
          </button>`;
        }
      }
      $('menu-corps').innerHTML = html;
    }

    /* ===== FICHE DE PARTIE (ÉCHIQUIER / ANALYSE / COUPS) ===== */
    async function ouvrirPartie(tournoiId, rondeId, partieId) {
      const t = await loadTournoi(tournoiId);
      let partie = null;
      for (const r of (t.rondes || [])) {
        if (rondeId && r.id !== rondeId) continue;
        partie = (r.parties || []).find((p) => p.id === partieId);
        if (partie) break;
      }
      if (!partie) return;
      const boards = buildBoardsFromCoups(partie.coups || []);
      STATE.gameCtx = {
        partie,
        tournoi: t,
        boards,
        plyIdx: boards.length - 1,
        flipped: Boolean(partie.noirs?.francais && !partie.blancs?.francais),
        tab: 'board',
      };
      $('game-sheet-title').textContent = `${nomAffiche(partie.blancs.nom)} – ${nomAffiche(partie.noirs.nom)} (${partie.resultat})`;
      updateGameTabs();
      renderGameSheet();
      openSheet('game-sheet');
    }

    function updateGameTabs() {
      const cur = STATE.gameCtx?.tab || 'board';
      document.querySelectorAll('#game-tabs .sheet-tab').forEach((b) => {
        b.classList.toggle('active', b.dataset.gtab === cur);
      });
    }

    function renderGameSheet() {
      const ctx = STATE.gameCtx;
      if (!ctx) return;
      const body = $('game-sheet-body');
      const p = ctx.partie;

      if (ctx.tab === 'board') {
        const bState = ctx.boards[ctx.plyIdx] || ctx.boards[0];
        const curPly = ctx.plyIdx > 0 ? p.coups[ctx.plyIdx - 1] : null;
        // Trouver la dernière pendule connue pour chaque camp jusqu'à plyIdx
        let clkW = null, clkB = null;
        for (let i = 0; i < ctx.plyIdx; i++) {
          if (p.coups[i]?.c != null) {
            if (i % 2 === 0) clkW = p.coups[i].c;
            else clkB = p.coups[i].c;
          }
        }
        const topP = ctx.flipped ? p.blancs : p.noirs;
        const botP = ctx.flipped ? p.noirs : p.blancs;
        const topClk = ctx.flipped ? clkW : clkB;
        const botClk = ctx.flipped ? clkB : clkW;

        const wp = curPly ? winPctFromPly(curPly) : 51.8;
        const whiteH = Math.max(4, Math.min(96, wp));
        const blackH = 100 - whiteH;
        const evTxt = fmtEval(curPly);

        let squaresHtml = '';
        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const rank = ctx.flipped ? row : 7 - row;
            const file = ctx.flipped ? 7 - col : col;
            const idx = rank * 8 + file;
            const isLight = (rank + file) % 2 === 1;
            const isHl = idx === bState.from || idx === bState.to;
            const piece = bState.b[idx];
            const pCls = piece ? (piece === piece.toUpperCase() ? 'pw' : 'pb') : '';
            squaresHtml += `<div class="sq ${isLight ? 'light' : 'dark'}${isHl ? ' hl' : ''}">
              ${col === 0 ? `<span class="coord r">${rank + 1}</span>` : ''}
              ${row === 7 ? `<span class="coord f">${'abcdefgh'[file]}</span>` : ''}
              ${piece ? `<span class="piece ${pCls}">${PIECE_GLYPHS[piece] || ''}</span>` : ''}
            </div>`;
          }
        }

        const moveBanner = curPly
          ? `Coup ${Math.ceil(ctx.plyIdx / 2)}${ctx.plyIdx % 2 === 1 ? '.' : '…'} <b>${esc(curPly.s)}</b>${evTxt ? ' · ' + esc(evTxt) : ''}`
          : 'Position initiale';

        body.innerHTML = `
          <div class="player-strip">
            <div class="player-strip-name" ${topP.fide_id ? `data-open-player="${esc(topP.fide_id)}"` : ''}>
              ${flagHtml(topP.drapeau)}${titreHtml(topP.titre)}<span>${esc(nomAffiche(topP.nom))}</span><span class="p-elo">${topP.elo || ''}</span>
            </div>
            ${topClk != null ? `<span class="clock-box ${topClk <= 60 ? 'low' : ''}">${fmtClk(topClk)}</span>` : ''}
          </div>

          <div class="board-stage">
            <div class="eval-bar" title="Évaluation">
              <div class="eval-black" style="height:${(ctx.flipped ? whiteH : blackH).toFixed(1)}%"></div>
              <div class="eval-white"></div>
              ${evTxt ? `<span class="eval-txt ${wp >= 50 ? 'bot' : 'top'}">${esc(evTxt)}</span>` : ''}
            </div>
            <div class="board-grid">${squaresHtml}</div>
          </div>

          <div class="player-strip">
            <div class="player-strip-name" ${botP.fide_id ? `data-open-player="${esc(botP.fide_id)}"` : ''}>
              ${flagHtml(botP.drapeau)}${titreHtml(botP.titre)}<span>${esc(nomAffiche(botP.nom))}</span><span class="p-elo">${botP.elo || ''}</span>
            </div>
            ${botClk != null ? `<span class="clock-box ${botClk <= 60 ? 'low' : ''}">${fmtClk(botClk)}</span>` : ''}
          </div>

          <div class="board-controls">
            <button class="ctrl-btn" id="mv-first" ${ctx.plyIdx === 0 ? 'disabled' : ''} aria-label="Début">⏮</button>
            <button class="ctrl-btn" id="mv-prev" ${ctx.plyIdx === 0 ? 'disabled' : ''} aria-label="Précédent">◀</button>
            <button class="ctrl-btn" id="mv-next" ${ctx.plyIdx >= ctx.boards.length - 1 ? 'disabled' : ''} aria-label="Suivant">▶</button>
            <button class="ctrl-btn" id="mv-last" ${ctx.plyIdx >= ctx.boards.length - 1 ? 'disabled' : ''} aria-label="Fin">⏭</button>
            <button class="ctrl-btn" id="mv-flip" aria-label="Retourner">⇅</button>
          </div>

          <div class="card" style="margin-top:12px">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.82rem">
              <span>${moveBanner}</span>
              <span style="color:var(--text-muted)">${esc(p.eco || '')}</span>
            </div>
            ${p.ouverture ? `<div class="game-meta" style="margin-top:4px">${esc(p.ouverture)}</div>` : ''}
            ${p.resume ? `<div class="focus-summary">${esc(p.resume)}</div>` : ''}
          </div>
        `;

        $('mv-first').onclick = () => { ctx.plyIdx = 0; renderGameSheet(); };
        $('mv-prev').onclick = () => { if (ctx.plyIdx > 0) { ctx.plyIdx--; renderGameSheet(); } };
        $('mv-next').onclick = () => { if (ctx.plyIdx < ctx.boards.length - 1) { ctx.plyIdx++; renderGameSheet(); } };
        $('mv-last').onclick = () => { ctx.plyIdx = ctx.boards.length - 1; renderGameSheet(); };
        $('mv-flip').onclick = () => { ctx.flipped = !ctx.flipped; renderGameSheet(); };
      } else if (ctx.tab === 'analyse') {
        const ana = p.analyse;
        if (!ana || !ana.courbe) {
          body.innerHTML = `<div class="empty-msg">Aucune analyse moteur disponible pour cette partie.</div>`;
          return;
        }
        const courbe = ana.courbe;
        const w = 320, h = 110;
        const pts = courbe.map((v, i) => {
          const x = courbe.length > 1 ? (i / (courbe.length - 1)) * w : w / 2;
          const y = h - ((v ?? 50) / 100) * h;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        const areaWhite = `0,${h} ${pts.join(' ')} ${w},${h}`;

        const b = ana.blancs || {};
        const n = ana.noirs || {};
        const srcLabel = p.eval_source === 'stockfish' ? 'Stockfish (CI)' : 'Lichess';

        body.innerHTML = `
          <div class="sec-head" style="margin-top:0">
            <div class="sec-title">Chances de gain ${infoBtn('Courbe dérivée des évaluations moteur (' + esc(srcLabel) + ') selon la formule publique Lichess. Touchez la courbe pour sauter au coup correspondant.')}</div>
            <span class="game-meta">${esc(srcLabel)}</span>
          </div>
          <div class="chart-box">
            <svg class="chart-svg" id="eval-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
              <rect x="0" y="0" width="${w}" height="${h}" fill="#1e293b" rx="4"/>
              <polygon points="${areaWhite}" fill="#e2e8f0" fill-opacity="0.88"/>
              <line x1="0" y1="${h / 2}" x2="${w}" y2="${h / 2}" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1"/>
              <polyline points="${pts.join(' ')}" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
            </svg>
          </div>

          <div class="stat-duo">
            <div class="stat-card">
              <div class="game-meta">Blancs · ${esc(nomAffiche(p.blancs.nom))}</div>
              <div class="stat-big">${b.precision != null ? b.precision.toFixed(1).replace('.', ',') + ' %' : '—'}</div>
              <div class="stat-sub">ACPL ${b.acpl ?? '—'} · ${b.gaffes || 0} gaffe(s) · ${b.erreurs || 0} err.</div>
            </div>
            <div class="stat-card">
              <div class="game-meta">Noirs · ${esc(nomAffiche(p.noirs.nom))}</div>
              <div class="stat-big">${n.precision != null ? n.precision.toFixed(1).replace('.', ',') + ' %' : '—'}</div>
              <div class="stat-sub">ACPL ${n.acpl ?? '—'} · ${n.gaffes || 0} gaffe(s) · ${n.erreurs || 0} err.</div>
            </div>
          </div>

          ${(ana.tournants || []).length ? `
            <div class="sec-head"><div class="sec-title">Tournants objectifs</div></div>
            ${ana.tournants.map((t) => `<div class="card clickable" data-jump-ply="${t.demi_coup}">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <b>Coup ${t.coup}${t.camp === 'blancs' ? '.' : '…'} ${esc(t.san)}</b>
                <span class="mv-tag ${esc(t.type)}">${esc(t.type)} (${esc(t.eval)})</span>
              </div>
              <div class="game-meta" style="margin-top:3px">Chute de chances de gain : −${t.delta_wp.toFixed(1).replace('.', ',')} pts</div>
            </div>`).join('')}
          ` : ''}

          ${ana.temps ? `
            <div class="sec-head"><div class="sec-title">Gestion du temps</div></div>
            <div class="stat-duo">
              <div class="stat-card">
                <div class="game-meta">Plus longue réflexion (B)</div>
                <div style="font-weight:700;margin-top:3px">${ana.temps.plus_long?.blancs ? `${fmtClk(ana.temps.plus_long.blancs.sec)} (${ana.temps.plus_long.blancs.coup}. ${esc(ana.temps.plus_long.blancs.san)})` : '—'}</div>
              </div>
              <div class="stat-card">
                <div class="game-meta">Plus longue réflexion (N)</div>
                <div style="font-weight:700;margin-top:3px">${ana.temps.plus_long?.noirs ? `${fmtClk(ana.temps.plus_long.noirs.sec)} (${ana.temps.plus_long.noirs.coup}… ${esc(ana.temps.plus_long.noirs.san)})` : '—'}</div>
              </div>
            </div>
          ` : ''}
        `;

        const svg = $('eval-chart');
        if (svg) {
          svg.onclick = (ev) => {
            const rect = svg.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
            ctx.plyIdx = Math.max(1, Math.min(ctx.boards.length - 1, Math.round(ratio * (courbe.length - 1)) + 1));
            ctx.tab = 'board';
            updateGameTabs();
            renderGameSheet();
          };
        }
      } else {
        // Onglet Coups
        const coups = p.coups || [];
        let rows = '';
        for (let i = 0; i < coups.length; i += 2) {
          const w = coups[i];
          const b = coups[i + 1];
          const num = (i / 2) + 1;
          const badge = (c) => c?.k === 'gaffe' ? '<span class="mv-tag gaffe">??</span>' : (c?.k === 'erreur' ? '<span class="mv-tag erreur">?</span>' : (c?.k === 'imprecision' ? '<span class="mv-tag imprecision">?!</span>' : ''));
          rows += `
            <div class="mv-num">${num}.</div>
            <button class="mv-btn ${ctx.plyIdx === i + 1 ? 'cur' : ''}" data-jump-ply="${i + 1}"><span>${esc(w.s)} ${badge(w)}</span><span class="mv-ev">${esc(fmtEval(w))}</span></button>
            ${b ? `<button class="mv-btn ${ctx.plyIdx === i + 2 ? 'cur' : ''}" data-jump-ply="${i + 2}"><span>${esc(b.s)} ${badge(b)}</span><span class="mv-ev">${esc(fmtEval(b))}</span></button>` : '<div></div>'}
          `;
        }
        body.innerHTML = coups.length ? `<div class="moves-grid">${rows}</div>` : `<div class="empty-msg">Aucun coup enregistré.</div>`;
      }
    }

    /* ===== FICHE JOUEUR ===== */
    function renderPlayerSheet() {
      const j = STATE.playerActif;
      if (!j) return;
      const b = j.bilan || {};
      const wp = j.wikipedia;
      const wd = j.wikidata;
      const car = j.carriere || {};
      const resAll = j.resultats_majeurs || j.tournois || [];

      const photoUrl = wd?.photo_commons
        ? wd.photo_commons.replace(/^http:\/\//, 'https://') + (wd.photo_commons.includes('Special:FilePath') && !wd.photo_commons.includes('width=') ? '?width=240' : '')
        : '';

      let html = `
        <div class="card" style="display:flex;align-items:center;gap:12px">
          ${photoUrl ? `<img class="player-photo" src="${esc(photoUrl)}" alt="${esc(nomAffiche(j.nom))}" loading="lazy" onerror="this.style.display='none'">` : ''}
          <div style="min-width:0;flex:1">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              ${flagHtml(j.drapeau, j.fed)}${titreHtml(j.titre)}<b style="font-size:1.02rem">${esc(nomAffiche(j.nom))}</b>
            </div>
            <div class="game-meta" style="margin-top:4px">${esc(j.pays || j.fed || '')}${j.annee_naissance ? ' · Né en ' + j.annee_naissance : ''} · ID FIDE ${esc(j.id)}</div>
            <div class="focus-pills">
              ${j.rangs?.monde_standard ? `<span class="mini-pill">Monde <b>#${j.rangs.monde_standard}</b></span>` : ''}
              ${j.rangs?.france_standard ? `<span class="mini-pill">France <b>#${j.rangs.france_standard}</b></span>` : ''}
            </div>
          </div>
        </div>

        <div class="stat-duo" style="grid-template-columns:repeat(3,1fr)">
          <div class="stat-card"><div class="game-meta">Classique</div><div class="stat-big">${j.elo?.standard || j.elo?.tournoi || '—'}</div></div>
          <div class="stat-card"><div class="game-meta">Rapide</div><div class="stat-big">${j.elo?.rapid || '—'}</div></div>
          <div class="stat-card"><div class="game-meta">Blitz</div><div class="stat-big">${j.elo?.blitz || '—'}</div></div>
        </div>
      `;

      // Palmarès & résultats en tournois majeurs (carrière collectée)
      if (resAll.length) {
        html += `<div class="sec-head">
          <div class="sec-title">Parcours en tournois majeurs (${resAll.length}) ${infoBtn('Ensemble des classements obtenus dans les tournois majeurs OTB collectés (2021–2026+). Cliquez sur un tournoi pour consulter son classement.')}</div>
        </div>
        <div class="stat-duo" style="grid-template-columns:repeat(4,1fr);margin-bottom:8px">
          <div class="stat-card"><div class="game-meta">Tournois</div><div class="stat-big" style="font-size:1.1rem">${car.tournois ?? resAll.length}</div></div>
          <div class="stat-card"><div class="game-meta">🥇 Titres</div><div class="stat-big" style="font-size:1.1rem;color:var(--accent-elo)">${car.victoires ?? 0}</div></div>
          <div class="stat-card"><div class="game-meta">Podiums</div><div class="stat-big" style="font-size:1.1rem">${car.podiums ?? 0}</div></div>
          <div class="stat-card"><div class="game-meta">Meilleur</div><div class="stat-big" style="font-size:1.1rem">${car.meilleur_rang ? '#' + car.meilleur_rang : '—'}</div></div>
        </div>`;

        if (resAll.length > 4) {
          const pFiltres = [
            ['tous', 'Tous'],
            ['podiums', 'Podiums'],
            ['fide', 'FIDE'],
            ['super', 'Super'],
            ['europe', 'Europe'],
            ['france', 'France'],
          ].filter(([k]) => k === 'tous' || (k === 'podiums' ? resAll.some((r) => r.rang && r.rang <= 3) : resAll.some((r) => r.categorie === k)));
          if (pFiltres.length > 1) {
            html += `<div class="seg-bar">${pFiltres.map(([k, l]) => `<button class="seg-btn ${STATE.playerFilter === k ? 'active' : ''}" data-pfilter="${k}">${l}</button>`).join('')}</div>`;
          }
        }

        const resFiltres = resAll.filter((r) => {
          if (STATE.playerFilter === 'tous') return true;
          if (STATE.playerFilter === 'podiums') return r.rang && r.rang <= 3;
          return r.categorie === STATE.playerFilter;
        });

        const medal = (rg) => rg === 1 ? '🥇' : (rg === 2 ? '🥈' : (rg === 3 ? '🥉' : (rg ? `#${rg}` : '—')));
        html += `<div class="card" style="padding:6px 10px">
          ${resFiltres.map((r) => {
            const accent = CAT_COLORS[r.categorie] || 'var(--accent-super)';
            const an = r.annee || (r.debut ? r.debut.slice(0, 4) : '');
            return `<div class="clickable" data-open-tour="${esc(r.id)}" style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(38,50,72,0.5);border-left:3px solid ${accent};padding-left:8px">
              <div style="min-width:34px;text-align:center;font-weight:700;font-size:0.86rem;color:${r.rang === 1 ? 'var(--accent-elo)' : 'var(--text)'}">${medal(r.rang)}</div>
              <div style="min-width:0;flex:1">
                <div style="font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.nom)}</div>
                <div class="game-meta">${an ? esc(String(an)) : ''}${r.nb_joueurs ? ` · ${r.rang ? r.rang + '/' + r.nb_joueurs : r.nb_joueurs + ' j.'}` : ''}${r.perf ? ' · Perf ' + r.perf : ''}</div>
              </div>
              <div style="text-align:right;flex:none;font-size:0.82rem;font-weight:700">
                ${r.score != null ? `${r.score}${r.jouees ? `<span style="color:var(--text-muted);font-weight:400">/${r.jouees}</span>` : ''}` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>`;
      }

      if (b.parties) {
        html += `<div class="card">
          <div class="game-meta" style="margin-bottom:6px">Bilan parties analysées (${b.parties} parties)</div>
          <div class="focus-pills" style="margin-top:0">
            <span class="mini-pill"><b>${b.v}</b> V · <b>${b.n}</b> N · <b>${b.d}</b> D</span>
            ${b.precision_moy != null ? `<span class="mini-pill">Précision moy. <b>${b.precision_moy.toFixed(1).replace('.', ',')} %</b></span>` : ''}
          </div>
        </div>`;
      }

      const pal = j.palmares || [];
      if (pal.length) {
        html += `<div class="sec-head">
          <div class="sec-title">🏆 Titres historiques (${pal.length}) ${infoBtn('Victoires recensées sur Wikidata (propriété P1346), y compris avant 2021.')}</div>
        </div>
        <div class="card" style="padding:8px 12px">
          ${pal.slice(0, 8).map((it) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(38,50,72,0.5);font-size:0.82rem">
            <span>${esc(it.titre)}</span>
            <span style="color:var(--accent-elo);font-weight:700;flex:none">${it.annee || ''}</span>
          </div>`).join('')}
          ${pal.length > 8 ? `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:0.76rem;color:var(--accent-super);font-weight:600">Voir les ${pal.length - 8} autres titres</summary>
            ${pal.slice(8).map((it) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(38,50,72,0.5);font-size:0.82rem">
              <span>${esc(it.titre)}</span>
              <span style="color:var(--accent-elo);font-weight:700;flex:none">${it.annee || ''}</span>
            </div>`).join('')}
          </details>` : ''}
        </div>`;
      }

      if (wp?.extrait) {
        html += `<div class="wiki-box">
          <div>${esc(wp.extrait).replace(/\n\n/g, '<br><br>')}</div>
          <div class="wiki-credit">Source : <a href="${esc(wp.url)}" target="_blank" rel="noopener">Wikipédia FR</a> (${esc(wp.licence || 'CC BY-SA 4.0')})</div>
        </div>`;
      }

      if ((j.parties || []).length) {
        html += `<div class="sec-head"><div class="sec-title">Parties récentes</div></div>`;
        for (const p of j.parties.slice(0, 15)) {
          const col = p.issue === 'v' ? 'var(--win)' : (p.issue === 'd' ? 'var(--loss)' : 'var(--draw)');
          html += `<div class="card clickable" style="border-left:3px solid ${col}" data-open-game="${esc(p.tournoi_id)}|${esc(p.ronde_id)}|${esc(p.partie_id)}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <div style="min-width:0">
                <div class="player-line"><span class="p-dot ${p.couleur === 'blancs' ? 'w' : 'b'}"></span><span>vs ${flagHtml(p.adversaire_drapeau)} <b>${esc(nomAffiche(p.adversaire))}</b></span><span class="p-elo">${p.adversaire_elo || ''}</span></div>
                <div class="game-meta" style="margin-top:3px">${esc(p.tournoi)} · ${esc(p.ronde)}${p.precision != null ? ' · ' + p.precision.toFixed(1).replace('.', ',') + ' %' : ''}</div>
              </div>
              <span class="res-pill">${esc(p.resultat)}</span>
            </div>
          </div>`;
        }
      }

      $('player-sheet-body').innerHTML = html;
    }

    async function ouvrirJoueur(fideId) {
      $('player-sheet-title').textContent = 'Chargement…';
      $('player-sheet-body').innerHTML = `<div class="empty-msg">Chargement de la fiche…</div>`;
      STATE.playerActif = null;
      STATE.playerFilter = 'tous';
      openSheet('player-sheet');
      try {
        const j = await loadJoueur(fideId);
        STATE.playerActif = j;
        $('player-sheet-title').textContent = `${j.titre ? j.titre + ' ' : ''}${nomAffiche(j.nom)}`;
        renderPlayerSheet();
      } catch (e) {
        $('player-sheet-body').innerHTML = `<div class="empty-msg">Fiche non disponible (${esc(e.message)}).</div>`;
      }
    }

    /* ===== GESTION DES FEUILLES, GLISSEMENT VERS LE BAS & INFO-BULLES ===== */
    function openSheet(id) {
      const el = $(id);
      if (!el) return;
      const sh = el.querySelector('.sheet');
      if (sh) { sh.style.transition = ''; sh.style.transform = ''; }
      STATE.zTop += 2;
      el.style.zIndex = String(STATE.zTop);
      el.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeSheet(id) {
      const el = $(id);
      if (!el) return;
      const sh = el.querySelector('.sheet');
      if (sh) { sh.style.transition = ''; sh.style.transform = ''; }
      el.classList.remove('open');
      if (!document.querySelector('.sheet-backdrop.open, .menu-backdrop.open')) {
        document.body.style.overflow = '';
      }
    }

    function attachSheetDrag(backdropId) {
      const bd = $(backdropId);
      const sheet = bd?.querySelector('.sheet');
      const body = bd?.querySelector('.sheet-body');
      if (!bd || !sheet) return;
      let startY = 0, startX = 0, startT = 0, dy = 0, active = false, canDrag = false;
      const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      sheet.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        const onTopZone = Boolean(e.target.closest('.sheet-handle, .sheet-head, .sheet-tabs'));
        canDrag = onTopZone || !body || body.scrollTop <= 0;
        if (!canDrag) return;
        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        startT = Date.now();
        dy = 0;
        active = false;
      }, { passive: true });

      sheet.addEventListener('touchmove', (e) => {
        if (!canDrag || e.touches.length !== 1) return;
        const curY = e.touches[0].clientY - startY;
        const curX = Math.abs(e.touches[0].clientX - startX);
        if (!active) {
          if (curY > 8 && curY > curX * 1.2) {
            active = true;
            closeInfo();
            sheet.style.transition = 'none';
            if (body) body.style.overflowY = 'hidden';
          } else if (curY < -6 || curX > 10) {
            canDrag = false;
            return;
          }
        }
        if (active) {
          e.preventDefault();
          dy = Math.max(0, curY);
          sheet.style.transform = `translateY(${dy}px)`;
        }
      }, { passive: false });

      const finish = () => {
        if (!active) { canDrag = false; return; }
        const dt = Math.max(1, Date.now() - startT);
        const vel = dy / dt;
        const shouldClose = dy > sheet.offsetHeight * 0.22 || (dy > 40 && vel > 0.45);
        if (body) body.style.overflowY = '';
        sheet.style.transition = reduced() ? 'none' : 'transform 0.2s ease-out';
        if (shouldClose) {
          sheet.style.transform = `translateY(${sheet.offsetHeight}px)`;
          setTimeout(() => closeSheet(backdropId), reduced() ? 0 : 180);
        } else {
          sheet.style.transform = '';
        }
        active = false; canDrag = false; dy = 0;
      };
      sheet.addEventListener('touchend', finish, { passive: true });
      sheet.addEventListener('touchcancel', finish, { passive: true });
    }

    attachSheetDrag('game-sheet');
    attachSheetDrag('player-sheet');
    attachSheetDrag('ronde-modal');

    function closeInfo() { $('info-pop').hidden = true; }

    function openInfo(btn) {
      const pop = $('info-pop');
      const idx = Number(btn.dataset.info);
      if (!pop.hidden && pop.dataset.idx === String(idx)) { closeInfo(); return; }
      pop.innerHTML = STATE.infoTexts[idx] || '';
      pop.dataset.idx = String(idx);
      pop.hidden = false;
      const r = btn.getBoundingClientRect();
      const pw = Math.min(310, window.innerWidth - 16);
      const left = Math.max(8, Math.min(window.innerWidth - pw - 8, r.left - pw / 2 + r.width / 2));
      const top = r.bottom + 8 + pop.offsetHeight < window.innerHeight ? r.bottom + 8 : Math.max(8, r.top - pop.offsetHeight - 8);
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
    }

    /* ===== ÉCOUTEURS GLOBAUX ===== */
    document.addEventListener('click', (ev) => {
      const info = ev.target.closest('.info-btn');
      if (info) { ev.stopPropagation(); openInfo(info); return; }
      if (!ev.target.closest('#info-pop')) closeInfo();

      const closeTarget = ev.target.closest('[data-close]');
      if (closeTarget) { closeSheet(closeTarget.dataset.close); return; }

      if (ev.target.classList.contains('sheet-backdrop')) { closeSheet(ev.target.id); return; }
      if (ev.target.id === 'menu-modal') { closeSheet('menu-modal'); return; }

      const nav = ev.target.closest('[data-nav]');
      if (nav) {
        closeSheet('menu-modal');
        if (nav.dataset.nav === 'accueil') ouvrirAccueil();
        else if (nav.dataset.nav === 'fide') ouvrirFide();
        return;
      }

      const tour = ev.target.closest('[data-open-tour]');
      if (tour) {
        closeSheet('menu-modal');
        closeSheet('player-sheet');
        ouvrirTournoi(tour.dataset.openTour);
        return;
      }

      const liveTour = ev.target.closest('[data-open-live]');
      if (liveTour) {
        const [tid, rid] = liveTour.dataset.openLive.split('|');
        ouvrirTournoiDirect(tid, rid || null);
        return;
      }

      const ronde = ev.target.closest('[data-choose-ronde]');
      if (ronde) {
        const rid = ronde.dataset.chooseRonde;
        STATE.rondeActiveId = rid;
        closeSheet('ronde-modal');
        const t = STATE.tournoiActif;
        const rObj = (t?.rondes || []).find((x) => x.id === rid);
        if (t?.direct && rObj && !(rObj.parties || []).length && rObj.statut !== 'a_venir') {
          chargerRondeDirect(t, rid).then(() => renderTournoi()).catch(() => renderTournoi());
        } else {
          renderTournoi();
        }
        syncUrl(true);
        return;
      }

      const acat = ev.target.closest('[data-acat]');
      if (acat) { STATE.accueilCat = acat.dataset.acat; STATE.accueilShowAll = false; renderAccueil(); return; }

      const ayear = ev.target.closest('[data-ayear]');
      if (ayear) { STATE.accueilAnnee = ayear.dataset.ayear; STATE.accueilShowAll = false; renderAccueil(); return; }

      const pfilter = ev.target.closest('[data-pfilter]');
      if (pfilter) { STATE.playerFilter = pfilter.dataset.pfilter; renderPlayerSheet(); return; }

      const fcat = ev.target.closest('[data-fcat]');
      if (fcat) { STATE.fideCat = fcat.dataset.fcat; renderFide(); return; }
      const fcad = ev.target.closest('[data-fcad]');
      if (fcad) { STATE.fideCad = fcad.dataset.fcad; renderFide(); return; }

      const gtab = ev.target.closest('[data-gtab]');
      if (gtab && STATE.gameCtx) {
        STATE.gameCtx.tab = gtab.dataset.gtab;
        updateGameTabs();
        renderGameSheet();
        return;
      }

      const jump = ev.target.closest('[data-jump-ply]');
      if (jump && STATE.gameCtx) {
        STATE.gameCtx.plyIdx = Number(jump.dataset.jumpPly);
        STATE.gameCtx.tab = 'board';
        updateGameTabs();
        renderGameSheet();
        return;
      }

      const player = ev.target.closest('[data-open-player]');
      if (player) { ev.stopPropagation(); ouvrirJoueur(player.dataset.openPlayer); return; }

      const game = ev.target.closest('[data-open-game]');
      if (game) {
        const [tid, rid, pid] = game.dataset.openGame.split('|');
        ouvrirPartie(tid, rid, pid);
        return;
      }
    });

    $('menu-btn').onclick = () => openSheet('menu-modal');
    $('menu-close').onclick = () => closeSheet('menu-modal');
    $('home-btn').onclick = () => ouvrirAccueil();

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        if (!$('info-pop').hidden) { closeInfo(); return; }
        const opens = [...document.querySelectorAll('.sheet-backdrop.open, .menu-backdrop.open')];
        if (opens.length) {
          opens.sort((a, b) => Number(b.style.zIndex || 0) - Number(a.style.zIndex || 0));
          closeSheet(opens[0].id);
        }
      } else if ($('game-sheet').classList.contains('open') && STATE.gameCtx?.tab === 'board') {
        if (ev.key === 'ArrowLeft' && STATE.gameCtx.plyIdx > 0) { STATE.gameCtx.plyIdx--; renderGameSheet(); }
        if (ev.key === 'ArrowRight' && STATE.gameCtx.plyIdx < STATE.gameCtx.boards.length - 1) { STATE.gameCtx.plyIdx++; renderGameSheet(); }
      }
    });

    /* ===== DÉMARRAGE ===== */
    async function boot() {
      const [idxT, idxH, fideD] = await Promise.allSettled([
        loadJson('tournois/index.json'),
        loadJson('historique/index.json'),
        loadJson('fide/classement.json'),
      ]);
      if (idxT.status === 'fulfilled') STATE.indexTournois = idxT.value;
      if (idxH.status === 'fulfilled') STATE.indexHistorique = idxH.value;
      if (fideD.status === 'fulfilled') STATE.fide = fideD.value;

      const params = new URLSearchParams(location.search);
      if (params.get('v') === 'fide') await ouvrirFide(false);
      else if (params.get('t')) await ouvrirTournoi(params.get('t'), params.get('r'), false);
      else await ouvrirAccueil(false);

      checkLiveLichess();
      setInterval(checkLiveLichess, 60000);
      setInterval(refreshDirectActif, 30000);
    }

    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(location.search);
      if (params.get('v') === 'fide') ouvrirFide(false);
      else if (params.get('t')) ouvrirTournoi(params.get('t'), params.get('r'), false);
      else ouvrirAccueil(false);
    });

    boot();
  })();
  </script>
</body>
